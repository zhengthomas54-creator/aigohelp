<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Invoice Generator | AIGoHelp</title>

    <meta
        name="description"
        content="Create a professional invoice online for free with AIGoHelp."
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #1f2937;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .title p {
            color: #6b7280;
            font-size: 18px;
        }

        .invoice-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #e5e7eb;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

      .items-header,
.item-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 100px;
    gap: 10px;
    align-items: center;
}.remove-button {
    padding: 10px;
    background: white;
    border: 1px solid #dc2626;
    color: #dc2626;
    border-radius: 8px;
    cursor: pointer;
}

.remove-button:hover {
    background: #fef2f2;
}

        .items-header {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-row {
            margin-bottom: 10px;
        }

        .item-row input {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .add-button {
            margin-top: 10px;
            background: white;
            border: 1px solid #111827;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .total-box {
            text-align: right;
            margin-top: 30px;
            font-size: 20px;
        }

        .total {
            font-size: 30px;
            font-weight: bold;
        }

        .generate-button {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .generate-button:hover {
            background: #374151;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .items-header {
                display: none;
            }

            .item-row {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .title h1 {
                font-size: 32px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        AIGoHelp
    </div>

</header>


<div class="container">

    <div class="title">

        <h1>
            Free Invoice Generator
        </h1>

        <p>
            Create a professional invoice in seconds.
        </p>

    </div>


    <div class="invoice-box">


        <!-- BUSINESS INFORMATION -->

        <div class="section">

            <h2>
                Business Information
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Business Name
                    </label>

                    <input
                        type="text"
                        placeholder="Your business name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <input
                        type="text"
                        placeholder="Business address"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        placeholder="+1 234 567 890"
                    >

                </div>

            </div>

        </div>


        <!-- CUSTOMER INFORMATION -->

        <div class="section">

            <h2>
                Bill To
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Customer Name
                    </label>

                    <input
                        type="text"
                        placeholder="Customer name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Customer Email
                    </label>

                    <input
                        type="email"
                        placeholder="customer@example.com"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Customer Address
                    </label>

                    <input
                        type="text"
                        placeholder="Customer address"
                    >

                </div>

            </div>

        </div>


        <!-- INVOICE INFORMATION -->

        <div class="section">

            <h2>
                Invoice Information
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Invoice Number
                    </label>

                    <input
                        type="text"
                        value="INV-001"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Invoice Date
                    </label>

                    <input
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Currency
                    </label>

                    <input
                        type="text"
                        value="USD"
                    >

                </div>

            </div>

        </div>


        <!-- ITEMS -->

        <div class="section">

            <h2>
                Items
            </h2>


          <div class="items-header">

    <div>
        Description
    </div>

    <div>
        Quantity
    </div>

    <div>
        Unit Price
    </div>

    <div>
        Amount
    </div>

    <div>
        Action
    </div>

</div>


<div id="items-container">

    <div class="item-row">

    <input
        type="text"
        class="description"
        placeholder="Product or service"
    >

    <input
        type="number"
        class="quantity"
        value="1"
        min="1"
        oninput="calculateTotal()"
    >

    <input
        type="number"
        class="unit-price"
        value="0"
        min="0"
        oninput="calculateTotal()"
    >

    <input
        type="text"
        class="amount"
        value="$0.00"
        readonly
    >

    <button
        type="button"
        class="remove-button"
        onclick="removeItem(this)"
    >
        Remove
    </button>

</div>
        >

    </div>

</div>


<button
    type="button"
    class="add-button"
    onclick="addItem()"
>
    + Add Item
</button>
            </button>

        </div>


        <!-- TOTAL -->

       <div class="total-box">

    <div>
        Subtotal:
        $<span id="subtotal">0.00</span>
    </div>

    <div style="margin-top: 10px;">

        Tax:

        <input
            id="taxRate"
            type="number"
            value="0"
            min="0"
            max="100"
            oninput="calculateTotal()"
            style="width: 70px; padding: 6px;"
        >

        %

        :

        $<span id="taxAmount">0.00</span>

    </div>

    <div class="total" style="margin-top: 15px;">

        Total:
        $<span id="total">0.00</span>

    </div>

</div>


        <button class="generate-button">
            Generate Invoice
        </button>


    </div>

</div>

<script>

function calculateTotal() {

    const itemRows =
        document.querySelectorAll(".item-row");


    let subtotal = 0;


    itemRows.forEach(function(row) {

        const quantity =
            parseFloat(
                row.querySelector(".quantity").value
            ) || 0;


        const unitPrice =
            parseFloat(
                row.querySelector(".unit-price").value
            ) || 0;


        const amount =
            quantity * unitPrice;


        row.querySelector(".amount").value =
            "$" + amount.toFixed(2);


        subtotal += amount;

    });


    const taxRate =
        parseFloat(
            document.getElementById("taxRate").value
        ) || 0;


    const taxAmount =
        subtotal * taxRate / 100;


    const total =
        subtotal + taxAmount;


    document.getElementById("subtotal").textContent =
        subtotal.toFixed(2);


    document.getElementById("taxAmount").textContent =
        taxAmount.toFixed(2);


    document.getElementById("total").textContent =
        total.toFixed(2);

}


function addItem() {

    const container =
        document.getElementById("items-container");

    const newItem =
        document.createElement("div");

    newItem.className =
        "item-row";

    newItem.innerHTML = `

        <input
            type="text"
            class="description"
            placeholder="Product or service"
        >

        <input
            type="number"
            class="quantity"
            value="1"
            min="1"
            oninput="calculateTotal()"
        >

        <input
            type="number"
            class="unit-price"
            value="0"
            min="0"
            oninput="calculateTotal()"
        >

        <input
            type="text"
            class="amount"
            value="$0.00"
            readonly
        >

        <button
            type="button"
            class="remove-button"
            onclick="removeItem(this)"
        >
            Remove
        </button>

    `;

    container.appendChild(newItem);

    calculateTotal();
}


function removeItem(button) {

    const row =
        button.parentElement;

    row.remove();

    calculateTotal();
}

</script>
</body>

</html>
